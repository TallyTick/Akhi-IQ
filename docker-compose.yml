services:
  postgres:
    image: postgres:16-alpine
    container_name: akhi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: akhi_user
      POSTGRES_PASSWORD: akhi_password
      POSTGRES_DB: akhi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akhi_user -d akhi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: akhi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
